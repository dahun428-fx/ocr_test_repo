[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-harness"
version = "0.0.1"
description = "OCR → 하네스 → Claude 평가 주도 개발(EDD) 체계"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.30",
    "rfc8785>=0.1.4",
    # OTLP JSON 인코더가 아직 베타라 버전을 고정합니다. 올릴 때는 테스트(SDK 출력이 스키마를 통과하는지)로 확인합니다.
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-json-common==0.66b2",
]

[project.optional-dependencies]
# 이미지를 다루는 부분(비전 OCR의 크기 줄이기, 열화)만 Pillow와 numpy를 씁니다.
image = ["pillow>=10", "numpy>=1.26"]
dev = ["pytest>=8", "pillow>=10", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocr_harness = ["schemas/*.json", "schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
